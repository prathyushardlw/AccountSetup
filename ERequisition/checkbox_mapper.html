  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #fff; }
    .container { display: flex; height: 100vh; }
    .sidebar { width: 400px; background: #16213e; padding: 20px; overflow-y: auto; border-right: 2px solid #0f3460; }
    .main { flex: 1; position: relative; overflow: auto; background: #0f0f23; }
    h1 { font-size: 1.2rem; margin-bottom: 15px; color: #00d9ff; }
    h2 { font-size: 1rem; margin: 15px 0 10px; color: #e94560; border-bottom: 1px solid #e94560; padding-bottom: 5px; }
    .checkbox-list { max-height: 60vh; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 4px 0; background: #1a1a2e; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
    .checkbox-item:hover { background: #0f3460; }
    .checkbox-item.active { border-color: #00d9ff; background: #0f3460; }
    .checkbox-item.mapped { border-color: #00ff88; }
    .checkbox-item .name { flex: 1; font-size: 0.85rem; }
    .checkbox-item .coords { font-size: 0.75rem; color: #888; font-family: monospace; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: #00d9ff; color: #000; }
    .btn-primary:hover { background: #00b8d9; }
    .btn-danger { background: #e94560; color: #fff; }
    .btn-success { background: #00ff88; color: #000; }
    .actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .pdf-container { position: relative; display: inline-block; }
    #pdfCanvas { cursor: crosshair; }
    .marker { position: absolute; width: 16px; height: 16px; border: 2px solid #00ff88; background: rgba(0, 255, 136, 0.3); transform: translate(-50%, -50%); pointer-events: none; font-size: 8px; color: #00ff88; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .marker.current { border-color: #00d9ff; background: rgba(0, 217, 255, 0.5); }
    .instructions { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.5; }
    .instructions ol { margin-left: 20px; }
    .status { padding: 10px; background: #1a1a2e; border-radius: 6px; margin-top: 10px; font-size: 0.85rem; }
    .export-area { margin-top: 15px; }
    .export-area textarea { width: 100%; height: 200px; background: #1a1a2e; color: #00ff88; border: 1px solid #0f3460; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.75rem; }
    .zoom-controls { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
    .search-box { width: 100%; padding: 8px 12px; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 6px; color: #fff; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>📍 Checkbox Position Mapper</h1>
      
      <div class="instructions">
        <strong>How to use:</strong>
        <ol>
          <li>Click a checkbox name in the list below</li>
          <li>Click on the PDF where the checkbox should be</li>
          <li>Repeat for all checkboxes</li>
          <li>Click "Export Coordinates" to get the code</li>
        </ol>
      </div>
      
      <input type="text" class="search-box" id="searchBox" placeholder="Search checkboxes...">
      
      <div class="status" id="status">Select a checkbox to map...</div>
      
      <div class="actions">
        <button class="btn btn-primary" onclick="exportCoordinates()">Export Coordinates</button>
        <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
        <button class="btn btn-success" onclick="saveToFile()">Save to File</button>
        <button class="btn btn-primary" onclick="loadFromFile()">Load Saved</button>
      </div>
      
      <h2>Checkboxes to Map</h2>
      <div class="checkbox-list" id="checkboxList"></div>
      
      <div class="export-area">
        <h2>Exported Code</h2>
        <textarea id="exportCode" readonly placeholder="Click 'Export Coordinates' to generate code..."></textarea>
      </div>
    </div>
    
    <div class="main" id="mainArea">
      <div class="pdf-container" id="pdfContainer">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </div>
  </div>
  
  <div class="zoom-controls">
    <button class="btn btn-primary" onclick="zoomIn()">➕ Zoom In</button>
    <button class="btn btn-primary" onclick="zoomOut()">➖ Zoom Out</button>

      { id: 'rheumatoidFactor', name: 'Rheumatoid Factor', group: 'Blood Tests R-V' },

      { id: 'totalT4', name: 'Total T4', group: 'Blood Tests R-V' },

      { id: 'urineMicroalbumin', name: 'Urine Microalbumin', group: 'Blood Tests R-V' },
      { id: 'valproicAcid', name: 'Valproic Acid', group: 'Blood Tests R-V' },
      { id: 'vancomycin', name: 'Vancomycin', group: 'Blood Tests R-V' },
      { id: 'vcaIgG', name: 'VCA IgG', group: 'Blood Tests R-V' },
      { id: 'vitaminB12', name: 'Vitamin B12', group: 'Blood Tests R-V' },
      { id: 'vitaminD', name: 'Vitamin D', group: 'Blood Tests R-V' },
      { id: 'vzvIgG', name: 'VZV IgG', group: 'Blood Tests R-V' },
      { id: 'wbc', name: 'WBC', group: 'Blood Tests R-V' },
      { id: 'albuminCreatinineRandomUrine', name: 'Albumin Creatinine Random Urine', group: 'Blood Tests R-V' },
      { id: 'allergyTestPanel', name: 'Allergy Test Panel', group: 'Blood Tests R-V' },
      { id: 'inhalantAllergens', name: 'Inhalant Allergens-36', group: 'Blood Tests R-V' },
      { id: 'foodAllergens25', name: 'Food Allergens-25', group: 'Blood Tests R-V' },
      // Wellness Panels
      { id: 'wellnessFemale', name: 'Wellness Panel - Female', group: 'Wellness' },
      { id: 'wellnessMen', name: 'Wellness Panel - Men', group: 'Wellness' },
    ];

    let mappedCoordinates = {};
    let currentCheckbox = null;
    let pdfScale = 1.0;
    let pdfDoc = null;
    let markers = {};

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('pdfContainer');

    // Initialize PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function loadPDF() {
      try {
        const loadingTask = pdfjsLib.getDocument('RMDS REQ Form April 10.pdf');
        pdfDoc = await loadingTask.promise;
        await renderPage();
      } catch (error) {
        console.error('Error loading PDF:', error);
        document.getElementById('status').textContent = 'Error loading PDF: ' + error.message;
      }
    }

    async function renderPage() {
      const page = await pdfDoc.getPage(1);
      const viewport = page.getViewport({ scale: pdfScale });
      
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      updateMarkers();
    }

    function renderCheckboxList() {
      const list = document.getElementById('checkboxList');
      const searchText = document.getElementById('searchBox').value.toLowerCase();
      
      let html = '';
      let currentGroup = '';
      
      CHECKBOXES.forEach((cb, index) => {
        if (searchText && !cb.name.toLowerCase().includes(searchText) && !cb.id.toLowerCase().includes(searchText)) {
          return;
        }
        
        if (cb.group !== currentGroup) {
          html += `<h2 style="font-size: 0.9rem; color: #e94560; margin: 15px 0 8px;">${cb.group}</h2>`;
          currentGroup = cb.group;
        }
        
        const mapped = mappedCoordinates[cb.id];
        const coords = mapped ? `(${mapped.x}, ${mapped.top})` : '';
        const mappedClass = mapped ? 'mapped' : '';
        const activeClass = currentCheckbox === cb.id ? 'active' : '';
        
        html += `
          <div class="checkbox-item ${mappedClass} ${activeClass}" onclick="selectCheckbox('${cb.id}')" data-id="${cb.id}">
            <span class="name">${cb.name}</span>
            <span class="coords">${coords}</span>
          </div>
        `;
      });
      
      list.innerHTML = html;
    }

    function selectCheckbox(id) {
      currentCheckbox = id;
      const cb = CHECKBOXES.find(c => c.id === id);
      document.getElementById('status').textContent = `Click on PDF to place: ${cb.name}`;
      renderCheckboxList();
      updateMarkers();
    }

    function handleCanvasClick(event) {
      if (!currentCheckbox) {
        document.getElementById('status').textContent = 'Please select a checkbox first!';
        return;
      }
      
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((event.clientX - rect.left) / pdfScale);
      const top = Math.round((event.clientY - rect.top) / pdfScale);
      
      mappedCoordinates[currentCheckbox] = { x, top };
      
      const cb = CHECKBOXES.find(c => c.id === currentCheckbox);
      document.getElementById('status').textContent = `✓ Mapped ${cb.name} to (${x}, ${top})`;
      
      // Auto-select next unmapped checkbox
      const currentIndex = CHECKBOXES.findIndex(c => c.id === currentCheckbox);
      for (let i = currentIndex + 1; i < CHECKBOXES.length; i++) {
        if (!mappedCoordinates[CHECKBOXES[i].id]) {
          selectCheckbox(CHECKBOXES[i].id);
          return;
        }
      }
      
      currentCheckbox = null;
      renderCheckboxList();
      updateMarkers();
    }

    function updateMarkers() {
      // Remove old markers
      Object.values(markers).forEach(m => m.remove());
      markers = {};
      
      // Add markers for mapped checkboxes
      Object.entries(mappedCoordinates).forEach(([id, coords]) => {
        const marker = document.createElement('div');
        marker.className = 'marker' + (id === currentCheckbox ? ' current' : '');
        marker.style.left = (coords.x * pdfScale) + 'px';
        marker.style.top = (coords.top * pdfScale) + 'px';
        marker.textContent = 'X';
        container.appendChild(marker);
        markers[id] = marker;
      });
    }

    function exportCoordinates() {
      const entries = CHECKBOXES.map(cb => {
        const coords = mappedCoordinates[cb.id];
        if (coords) {
          return `    { id: '${cb.id}', x: ${coords.x}, top: ${coords.top} }`;
        }
        return `    // { id: '${cb.id}', x: 0, top: 0 } // NOT MAPPED`;
      });
      
      const code = `const CHECK_FIELDS = [\n${entries.join(',\n')}\n];`;
      document.getElementById('exportCode').value = code;
      
      // Copy to clipboard
      navigator.clipboard.writeText(code).then(() => {
        document.getElementById('status').textContent = 'Code exported and copied to clipboard!';
      });
    }

    function clearAll() {
      if (confirm('Clear all mapped coordinates?')) {
        mappedCoordinates = {};
        currentCheckbox = null;
        renderCheckboxList();
        updateMarkers();
        document.getElementById('status').textContent = 'All coordinates cleared.';
      }
    }

    function saveToFile() {
      const data = JSON.stringify(mappedCoordinates, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'checkbox_coordinates.json';
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('status').textContent = 'Coordinates saved to file!';
    }

    function loadFromFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        const text = await file.text();
        mappedCoordinates = JSON.parse(text);
        renderCheckboxList();
        updateMarkers();
        document.getElementById('status').textContent = `Loaded ${Object.keys(mappedCoordinates).length} coordinates!`;
      };
      input.click();
    }

    function zoomIn() {
      pdfScale = Math.min(3.0, pdfScale + 0.25);
      renderPage();
    }

    function zoomOut() {
      pdfScale = Math.max(0.5, pdfScale - 0.25);
      renderPage();
    }

    function resetZoom() {
      pdfScale = 1.0;
      renderPage();
    }

    // Initialize
    document.getElementById('searchBox').addEventListener('input', renderCheckboxList);
    canvas.addEventListener('click', handleCanvasClick);
    
    renderCheckboxList();
    loadPDF();
    
    // Try to load saved coordinates
    try {
      const saved = localStorage.getItem('checkboxCoordinates');
      if (saved) {
        mappedCoordinates = JSON.parse(saved);
        renderCheckboxList();
        document.getElementById('status').textContent = `Loaded ${Object.keys(mappedCoordinates).length} saved coordinates.`;
      }
    } catch (e) {}
    
    // Auto-save to localStorage
    setInterval(() => {
      localStorage.setItem('checkboxCoordinates', JSON.stringify(mappedCoordinates));
    }, 5000);
  </script>
